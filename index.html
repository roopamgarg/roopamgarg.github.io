    <script>
      (function () {
        try {
          var p = localStorage.getItem("theme-preference");
          var resolved = "dark";
          if (p === "light") {
            resolved = "light";
          } else if (p === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
